<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Flash Cards</h1>

  <div class="top-bar-question">
    <span class="percentage js-percentage">25%</span>
    <span class="question-number js-question-number">5 of 20</span>
  </div>

  <div class="question-answer-area">
    <div class="question-answer js-question-answer">What is the difference between var,let and const?</div>
    <div class="question-navigation">
      <button class="previous js-previous-button">< Previous</button>
      <button class="show-hide-answer js-show-hide-answer">Show Answer</button>
      <button class="next js-next-button">Next ></button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
